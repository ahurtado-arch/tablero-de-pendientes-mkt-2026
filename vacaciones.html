<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Vacaciones 2026 - TDC</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tdc-red: #FF3700;
            --tdc-red-dark: #E63100;
            --tdc-navy: #1A324D;
            --celeste: #4F8FCC;
            --celeste-bright: #8FC1EC;
            --bg: #FFFFFF;
            --surface: #F6F9FD;
            --surface-2: #EAF1FB;
            --text: #1A324D;
            --text-soft: #5A6B82;
            --text-faint: #93A1B5;
            --border: #E2EAF3;
            --success: #1D9E75;
            --warning: #E8920C;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 18px rgba(26, 50, 77, 0.06);
            --shadow-hover: 0 10px 28px rgba(26, 50, 77, 0.12);
        }

        body {
            font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.4;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 32px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            z-index: 50;
        }
        .topbar-logo { height: 38px; width: auto; display: block; }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-soft);
        }
        .topbar-right .pill {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 30px;
            font-weight: 500;
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 32px 48px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* ===== Header de bienvenida ===== */
        .welcome {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .welcome-left { display: flex; align-items: center; gap: 16px; }
        .avatar {
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 19px; flex-shrink: 0;
        }
        .welcome h1 { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
        .welcome .role { font-size: 14px; color: var(--text-soft); margin-top: 2px; }
        .welcome .role span { color: var(--celeste); font-weight: 600; }

        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--tdc-red); color: #fff; border: none;
            padding: 13px 20px; border-radius: var(--radius-sm);
            font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,55,0,0.25);
            transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--tdc-red-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255,55,0,0.32); }
        .btn-primary svg { width: 17px; height: 17px; }

        /* ===== Tarjetas de métricas ===== */
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .metric {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: all 0.2s;
        }
        .metric:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .metric-top { display: flex; align-items: center; justify-content: space-between; }
        .metric-chip {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface-2); color: var(--celeste);
        }
        .metric-chip svg { width: 21px; height: 21px; }
        .metric-chip.red { background: rgba(255,55,0,0.1); color: var(--tdc-red); }
        .metric-chip.green { background: rgba(29,158,117,0.12); color: var(--success); }
        .metric-chip.navy { background: rgba(26,50,77,0.08); color: var(--tdc-navy); }
        .metric-label { font-size: 13px; color: var(--text-soft); font-weight: 500; }
        .metric-value { font-size: 34px; font-weight: 700; color: var(--text); line-height: 1; letter-spacing: -0.5px; }
        .metric-value.neg { color: var(--tdc-red); }
        .metric-value small { font-size: 15px; font-weight: 500; color: var(--text-faint); }
        .metric-foot { font-size: 12px; color: var(--text-faint); }
        .metric.clickable { cursor: pointer; }
        .metric.clickable:hover { border-color: var(--celeste); }
        .metric-link { font-size: 12px; color: var(--celeste); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .metric-link svg { width: 13px; height: 13px; }

        /* ===== Lista de detalle (modal) ===== */
        .detail-list { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
        .detail-item {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px;
            border-left: 4px solid var(--celeste);
        }
        .detail-item.medical { border-left-color: var(--success); }
        .detail-range { font-size: 14px; font-weight: 600; color: var(--text); }
        .detail-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
        .detail-days { font-size: 18px; font-weight: 700; color: var(--text); white-space: nowrap; }
        .detail-empty { padding: 28px 6px; text-align: center; font-size: 13px; color: var(--text-faint); }
        .detail-total { font-size: 13px; color: var(--text-soft); padding: 4px 2px 0; font-weight: 500; }

        /* ===== Calendario ===== */
        .card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .card-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }
        .card-head h2 {
            font-size: 16px; font-weight: 600; color: var(--text);
            display: flex; align-items: center; gap: 9px;
        }
        .card-head h2 svg { width: 18px; height: 18px; color: var(--celeste); }
        .cal-nav { display: flex; align-items: center; gap: 6px; }
        .cal-nav .month { font-size: 14px; font-weight: 600; color: var(--text); min-width: 120px; text-align: center; }
        .cal-nav button {
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid var(--border); background: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; color: var(--text-soft);
            transition: all 0.2s;
        }
        .cal-nav button:hover { background: var(--surface); border-color: var(--celeste); color: var(--tdc-navy); }
        .cal-nav button svg { width: 16px; height: 16px; }

        .cal-body { padding: 18px 22px 22px; }
        .cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
        .cal-weekdays { margin-bottom: 8px; }
        .cal-weekday { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.5px; }
        .cal-day {
            aspect-ratio: 1; min-height: 54px;
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 7px 0 0; gap: 4px; position: relative;
            font-size: 13px; font-weight: 500;
        }
        .cal-day.other { background: transparent; border-color: transparent; color: var(--text-faint); }
        .cal-day.today { border-color: var(--tdc-red); border-width: 2px; background: rgba(255,55,0,0.05); }
        .cal-day.today .cal-num { color: var(--tdc-red); font-weight: 700; }
        .cal-num { font-size: 13px; color: var(--text); }
        .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 80%; }
        .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
        .cal-day.mine { background: rgba(79,143,204,0.1); border-color: var(--celeste); }

        .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; }
        .legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-soft); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        /* ===== Fila calendario + solicitudes ===== */
        .cal-row { display: grid; grid-template-columns: 1.7fr 1fr; gap: 22px; align-items: start; }
        .req-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
        .req-item {
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 12px 14px; border-left: 4px solid var(--border);
            transition: all 0.2s;
        }
        .req-item.approved { border-left-color: var(--success); }
        .req-item.pending { border-left-color: var(--warning); }
        .req-item.rejected { border-left-color: var(--tdc-red); }
        .req-item:hover { background: var(--surface); }
        .req-range { font-size: 14px; font-weight: 600; color: var(--text); }
        .req-meta { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
        .req-status { font-size: 12px; font-weight: 600; margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; }
        .req-status svg { width: 13px; height: 13px; }
        .req-status.approved { color: var(--success); }
        .req-status.pending { color: var(--warning); }
        .req-status.rejected { color: var(--tdc-red); }
        .req-empty { padding: 24px 6px; text-align: center; font-size: 13px; color: var(--text-faint); line-height: 1.6; }
        @media (max-width: 860px) { .cal-row { grid-template-columns: 1fr; } }

        /* ===== Modal solicitar ===== */
        .modal { display: none; position: fixed; inset: 0; background: rgba(26,50,77,0.45); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .modal.active { display: flex; }
        .modal-card { background: #fff; border-radius: var(--radius); width: 100%; max-width: 460px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .modal-head { padding: 20px 22px; border-bottom: 1px solid var(--border); font-size: 17px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 9px; }
        .modal-head svg { width: 19px; height: 19px; color: var(--tdc-red); }
        .modal-body { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .field input, .field textarea {
            width: 100%; padding: 11px 12px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-family: inherit; font-size: 14px;
            background: var(--surface); color: var(--text);
        }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--tdc-red); box-shadow: 0 0 0 3px rgba(255,55,0,0.1); }
        .field .hint { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
        .modal-foot { padding: 18px 22px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .modal-foot button { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-cancel { background: #fff; border: 1px solid var(--border); color: var(--text-soft); }
        .btn-cancel:hover { background: var(--surface-2); }
        .btn-save { background: var(--tdc-red); border: none; color: #fff; }
        .btn-save:hover { background: var(--tdc-red-dark); }

        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: var(--success); color: #fff; padding: 13px 18px;
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 9px; z-index: 2000;
            box-shadow: 0 8px 22px rgba(26,50,77,0.2);
            animation: slideIn 0.3s ease;
        }
        .toast.error { background: var(--tdc-red); }
        .toast svg { width: 18px; height: 18px; }
        @keyframes slideIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 700px) {
            .topbar, .wrap { padding-left: 18px; padding-right: 18px; }
            .welcome h1 { font-size: 22px; }
        }
    </style>
</head>

            <div class="req-body" id="requests-list"></div>
        </div>
        </div>
    </div>

    <div class="modal" id="request-modal">
        <div class="modal-card">
            <div class="modal-head">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Solicitar vacaciones
            </div>
            <div class="modal-body">
                <div class="field">
                    <label>Fecha de inicio</label>
                    <input type="date" id="req-start">
                </div>
                <div class="field">
                    <label>Fecha de fin</label>
                    <input type="date" id="req-end">
                </div>
                <div class="field">
                    <label>Nota (opcional)</label>
                    <textarea id="req-notes" rows="2" placeholder="Motivo o detalle de tu solicitud"></textarea>
                    <div class="hint" id="req-days-hint"></div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn-cancel" onclick="closeRequest()">Cancelar</button>
                <button class="btn-save" onclick="submitRequest()">Enviar solicitud</button>
            </div>
        </div>
    </div>

    <div class="modal" id="detail-modal">
        <div class="modal-card">
            <div class="modal-head" id="detail-title"></div>
            <div class="modal-body">
                <div class="detail-list" id="detail-list"></div>
            </div>
            <div class="modal-foot">
                <button class="btn-cancel" onclick="closeDetail()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        // ====== Persona logueada: llega por ?member=<nombre> desde la plataforma ======
        const CURRENT_MEMBER_ID = 1; // fallback si no llega el parámetro
        const REQUESTED_MEMBER = new URLSearchParams((location.hash||'').replace(/^#/,'')).get('member') || new URLSearchParams(location.search).get('member');
        function normName(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }

        const colorPalette = ['#378ADD','#1D9E75','#D85A30','#7F77DD','#BA7517','#534AB7'];
        const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        const VACATION_YEAR = 2026, DAYS_PER_MONTH = 2.5, MAX_ACCRUAL = 30;

        const initialMembers = [
            { id: 1, name: 'Johan Gálvez', role: 'Ejecutivo de marketing', joinDate: '2026-01-01', carryover: 0, debt: 0, color: colorPalette[0] },
            { id: 2, name: 'Pablo Caillahua', role: 'Diseñador', joinDate: '2026-01-01', carryover: 0, debt: 0, color: colorPalette[1] },
            { id: 3, name: 'Ana Paula Hurtado', role: 'Community manager', joinDate: '2026-01-01', carryover: 0, debt: 0, color: colorPalette[2] },
            { id: 4, name: 'Diego David', role: 'Audiovisual', joinDate: '2026-01-01', carryover: 9, debt: 0, color: colorPalette[3] },
            { id: 5, name: 'Eduardo Cornejo', role: 'Performance', joinDate: '2026-01-01', carryover: 0, debt: 0, color: colorPalette[4] },
            { id: 6, name: 'Gabriela Curotto', role: 'Dirección de marketing', joinDate: '2026-01-01', carryover: 0, debt: 0, color: colorPalette[5] }
        ];

        let currentDate = new Date();

        function loadData() {
            const d = localStorage.getItem('vacationData');
            const parsed = d ? JSON.parse(d) : { members: initialMembers, vacations: [], medicalRests: [] };
            if (!parsed.vacations) parsed.vacations = [];
            if (!parsed.medicalRests) parsed.medicalRests = [];
            return parsed;
        }
        function saveData(d) { localStorage.setItem('vacationData', JSON.stringify(d)); }

        function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
        function toISO(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
        function fmtNum(n) { return Number.isInteger(n) ? n : Math.round(n*10)/10; }
        function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000) + 1; }

        function monthsWorked(joinDate) {
            const today = new Date();
            const yearStart = new Date(VACATION_YEAR, 0, 1);
            let start = parseDate(joinDate);
            if (start < yearStart) start = yearStart;
            if (today < start) return 0;
            const m = (today.getFullYear()-start.getFullYear())*12 + (today.getMonth()-start.getMonth()) + 1;
            return Math.max(0, Math.min(12, m));
        }
        function accruedDays(member) { return Math.min(MAX_ACCRUAL, monthsWorked(member.joinDate) * DAYS_PER_MONTH); }

        function getMember(data) {
            if (REQUESTED_MEMBER) {
                const found = data.members.find(m => normName(m.name) === normName(REQUESTED_MEMBER));
                if (found) return found;
            }
            return data.members.find(m => m.id === CURRENT_MEMBER_ID) || data.members[0];
        }

        function svg(paths) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
        }
        const IC = {
            check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
            chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
            plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
            stethoscope: '<path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/>',
            alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
            clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
            x: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
            check2: '<polyline points="20 6 9 17 4 12"/>',
            list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
            chevronRight: '<polyline points="9 18 15 12 9 6"/>'
        };
        const monthsShort = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
        function fmtRange(s, e) {
            const a = parseDate(s), b = parseDate(e);
            const sameMonth = a.getMonth() === b.getMonth();
            return sameMonth
                ? `${a.getDate()} – ${b.getDate()} ${monthsShort[b.getMonth()]}`
                : `${a.getDate()} ${monthsShort[a.getMonth()]} – ${b.getDate()} ${monthsShort[b.getMonth()]}`;
        }

        function render() {
            const data = loadData();
            const member = getMember(data);

            const initials = member.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
            const av = document.getElementById('welcome-avatar');
            av.textContent = initials;
            av.style.background = member.color + '22';
            av.style.color = member.color;
            document.getElementById('welcome-name').textContent = `Hola, ${member.name.split(' ')[0]}`;
            document.getElementById('welcome-role').innerHTML = `${member.name} · <span>${member.role || 'Equipo TDC'}</span>`;

            // Métricas
            const accrued = accruedDays(member);
            const total = accrued + (member.carryover||0) - Math.abs(member.debt||0);
            const taken = data.vacations.filter(v => v.memberId === member.id && v.status === 'approved').reduce((s,v) => s+v.days, 0);
            const remaining = total - taken;
            const medical = data.medicalRests.filter(r => r.memberId === member.id && r.type !== 'falta').reduce((s,r) => s+r.days, 0);

            document.getElementById('metrics').innerHTML = `
                <div class="metric">
                    <div class="metric-top">
                        <span class="metric-label">Días disponibles</span>
                        <span class="metric-chip ${remaining < 0 ? 'red' : 'green'}">${svg(IC.check)}</span>
                    </div>
                    <div class="metric-value ${remaining < 0 ? 'neg' : ''}">${fmtNum(remaining)}</div>
                    <div class="metric-foot">de ${fmtNum(total)} días en total</div>
                </div>
                <div class="metric">
                    <div class="metric-top">
                        <span class="metric-label">Acumulados 2026</span>
                        <span class="metric-chip navy">${svg(IC.chart)}</span>
                    </div>
                    <div class="metric-value">${fmtNum(accrued)}</div>
                    <div class="metric-foot">${monthsWorked(member.joinDate)} meses · 2.5 por mes</div>
                </div>
                <div class="metric clickable" onclick="openDetail('taken')">
                    <div class="metric-top">
                        <span class="metric-label">Días tomados</span>
                        <span class="metric-chip navy">${svg(IC.plane)}</span>
                    </div>
                    <div class="metric-value">${fmtNum(taken)}</div>
                    <div class="metric-link">${svg(IC.list)} Ver detalle</div>
                </div>
                <div class="metric clickable" onclick="openDetail('medical')">
                    <div class="metric-top">
                        <span class="metric-label">Descanso médico</span>
                        <span class="metric-chip">${svg(IC.stethoscope)}</span>
                    </div>
                    <div class="metric-value">${fmtNum(medical)} <small>días</small></div>
                    <div class="metric-link">${svg(IC.list)} Ver detalle</div>
                </div>`;

            renderCalendar(data, member);
            renderRequests(data, member);
        }

        function renderRequests(data, member) {
            const cont = document.getElementById('requests-list');
            const mine = data.vacations
                .filter(v => v.memberId === member.id)
                .sort((a, b) => new Date(b.startDate) - new Date(a.startDate));

            if (mine.length === 0) {
                cont.innerHTML = '<div class="req-empty">Aún no tienes solicitudes.<br>Usa “Solicitar vacaciones” para registrar una.</div>';
                return;
            }

            cont.innerHTML = mine.map(v => {
                const label = v.status === 'approved' ? 'Aprobado' : v.status === 'pending' ? 'Pendiente' : 'Rechazado';
                const ico = v.status === 'approved' ? IC.check2 : v.status === 'pending' ? IC.clock : IC.x;
                return `<div class="req-item ${v.status}">
                    <div class="req-range">${fmtRange(v.startDate, v.endDate)}</div>
                    <div class="req-meta">${v.days} día(s)</div>
                    <div class="req-status ${v.status}">${svg(ico)} ${label}</div>
                </div>`;
            }).join('');
        }

        function renderCalendar(data, member) {
            const year = currentDate.getFullYear(), month = currentDate.getMonth();
            document.getElementById('cal-month').textContent = `${monthNames[month]} ${year}`;
            const first = new Date(year, month, 1);
            const start = new Date(first);
            const offset = (first.getDay() + 6) % 7; // lunes = 0
            start.setDate(start.getDate() - offset);

            const today = new Date(); today.setHours(0,0,0,0);
            const cont = document.getElementById('cal-days');
            cont.innerHTML = '';

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < offset; i++) { cont.appendChild(document.createElement('div')); }
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, month, d);
                const dateStr = toISO(date);
                const cell = document.createElement('div');
                cell.className = 'cal-day';
                if (date.getTime() === today.getTime()) cell.classList.add('today');

                const num = document.createElement('div');
                num.className = 'cal-num';
                num.textContent = d;
                cell.appendChild(num);

                const dayVacs = data.vacations.filter(v => dateStr >= v.startDate && dateStr <= v.endDate && v.status !== 'rejected');
                const dayMed = data.medicalRests.filter(r => dateStr >= r.startDate && dateStr <= r.endDate && r.type !== 'falta');
                const mineToday = dayVacs.some(v => v.memberId === member.id);
                if (mineToday) cell.classList.add('mine');

                if (dayVacs.length || dayMed.length) {
                    const dots = document.createElement('div');
                    dots.className = 'cal-dots';
                    const names = [];
                    dayVacs.forEach(v => {
                        const dot = document.createElement('span');
                        dot.className = 'cal-dot';
                        const mine = v.memberId === member.id;
                        dot.style.background = v.status === 'pending' ? 'var(--warning)' : (mine ? 'var(--celeste)' : 'var(--text-faint)');
                        dots.appendChild(dot);
                        const mb = data.members.find(m => m.id === v.memberId);
                        names.push((mb ? mb.name : '?') + (v.status === 'pending' ? ' (pendiente)' : ''));
                    });
                    dayMed.forEach(r => {
                        const dot = document.createElement('span');
                        dot.className = 'cal-dot';
                        dot.style.background = 'var(--success)';
                        dots.appendChild(dot);
                        const mb = data.members.find(m => m.id === r.memberId);
                        names.push((mb ? mb.name : '?') + ' (descanso)');
                    });
                    cell.appendChild(dots);
                    cell.title = names.join('\n');
                }
                cont.appendChild(cell);
            }
        }

        // ===== Detalle de tomados / descanso médico =====
        function openDetail(type) {
            const data = loadData();
            const member = getMember(data);
            const titleEl = document.getElementById('detail-title');
            const listEl = document.getElementById('detail-list');
            let records, title, totalLabel;

            if (type === 'medical') {
                records = data.medicalRests.filter(r => r.memberId === member.id && r.type !== 'falta');
                title = `${svg(IC.stethoscope)} Descanso médico`;
            } else {
                records = data.vacations.filter(v => v.memberId === member.id && v.status === 'approved');
                title = `${svg(IC.plane)} Días tomados`;
            }
            records = records.slice().sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
            const total = records.reduce((s, r) => s + r.days, 0);

            titleEl.innerHTML = title;

            if (records.length === 0) {
                listEl.innerHTML = `<div class="detail-empty">${type === 'medical' ? 'No tienes descansos médicos registrados.' : 'Aún no tienes días tomados (vacaciones aprobadas).'}</div>`;
            } else {
                const rows = records.map(r => {
                    let sub;
                    if (type === 'medical') {
                        sub = r.type === 'personal' ? 'Asunto personal' : r.type === 'other' ? 'Otro' : 'Descanso médico';
                    } else {
                        sub = 'Vacaciones aprobadas';
                    }
                    return `<div class="detail-item ${type === 'medical' ? 'medical' : ''}">
                        <div>
                            <div class="detail-range">${fmtRange(r.startDate, r.endDate)}</div>
                            <div class="detail-sub">${sub}</div>
                        </div>
                        <div class="detail-days">${fmtNum(r.days)} <span style="font-size:12px;font-weight:500;color:var(--text-faint)">d</span></div>
                    </div>`;
                }).join('');
                listEl.innerHTML = rows + `<div class="detail-total">Total: ${fmtNum(total)} día(s) · ${records.length} registro(s)</div>`;
            }
            document.getElementById('detail-modal').classList.add('active');
        }
        function closeDetail() { document.getElementById('detail-modal').classList.remove('active'); }

        function prevMonth() { currentDate.setMonth(currentDate.getMonth()-1); render(); }
        function nextMonth() { currentDate.setMonth(currentDate.getMonth()+1); render(); }

        // ===== Solicitar vacaciones =====
        function openRequest() {
            document.getElementById('req-start').value = '';
            document.getElementById('req-end').value = '';
            document.getElementById('req-notes').value = '';
            document.getElementById('req-days-hint').textContent = '';
            document.getElementById('request-modal').classList.add('active');
        }
        function closeRequest() { document.getElementById('request-modal').classList.remove('active'); }

        function updateDaysHint() {
            const s = document.getElementById('req-start').value, e = document.getElementById('req-end').value;
            const hint = document.getElementById('req-days-hint');
            if (s && e) {
                const n = daysBetween(s, e);
                hint.textContent = n > 0 ? `${n} día(s) calendario solicitados.` : 'La fecha de fin debe ser posterior.';
            } else hint.textContent = '';
        }

        function submitRequest() {
            const s = document.getElementById('req-start').value, e = document.getElementById('req-end').value;
            const notes = document.getElementById('req-notes').value;
            if (!s || !e) { toast('Completa las fechas de inicio y fin', 'error'); return; }
            const n = daysBetween(s, e);
            if (n <= 0) { toast('La fecha de fin debe ser posterior a la de inicio', 'error'); return; }
            const data = loadData();
            data.vacations.push({ id: Date.now(), memberId: getMember(data).id, startDate: s, endDate: e, days: n, status: 'pending', notes, requestedAt: toISO(new Date()) });
            saveData(data);
            closeRequest();
            render();
            toast('Solicitud enviada. Queda pendiente de aprobación.');
        }

        function toast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast' + (type === 'error' ? ' error' : '');
            t.innerHTML = svg(type === 'error' ? IC.alert : IC.check) + `<span>${msg}</span>`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }

        document.getElementById('req-start').addEventListener('change', updateDaysHint);
        document.getElementById('req-end').addEventListener('change', updateDaysHint);
        document.getElementById('request-modal').addEventListener('click', e => { if (e.target.id === 'request-modal') closeRequest(); });
        document.getElementById('detail-modal').addEventListener('click', e => { if (e.target.id === 'detail-modal') closeDetail(); });

        render();
    </script>
</body>
</html>
